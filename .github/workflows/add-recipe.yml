name: Add a recipe

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: add-recipe
  cancel-in-progress: false

jobs:
  import:
    # Only the site owner can add recipes. Anyone else's submission is ignored.
    if: github.event.issue.user.login == 'rsissons' && contains(github.event.issue.labels.*.name, 'add-recipe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Read and sort the recipe
        id: imp
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .github/scripts/import_recipe.py

      - name: Publish
        if: steps.imp.outputs.status == 'added'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.imp.outputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add added.js
          git commit -m "$MSG"
          git pull --rebase
          git push

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f comment.md ]; then echo "Something went wrong reading that link. Check the Actions log." > comment.md; fi
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file comment.md
          if [ "${{ steps.imp.outputs.status }}" = "added" ]; then
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason completed
          else
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason "not planned"
          fi
